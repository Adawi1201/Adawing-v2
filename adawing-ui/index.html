    <title>AdaWing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
    <!-- Preload highlight.js (with Vditor's own element ids) so its loader
         dedupes by id and the first render already has window.hljs; otherwise
         initial code blocks race the lazy-injected script and miss keyword
         colors / language labels until a re-render. -->
    <script defer id="vditorHljsScript" src="/vditor/dist/js/highlight.js/highlight.min.js"></script>
    <script defer id="vditorHljsThirdScript" src="/vditor/dist/js/highlight.js/third-languages.js"></script>
  </head>

    <script type="module" src="/src/main.js"></script>
  </body>
